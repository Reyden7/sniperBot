[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sniper"
version = "0.16.0"
description = "SNIPER: recherche et qualification Binance Spot, sans ordre live"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "numpy>=2.3,<3",
  "polars>=1.32,<2",
  "duckdb>=1.4,<2",
  "pyarrow>=21,<24",
  "tzdata>=2025.2",
  "scikit-learn>=1.7,<2",
  "scipy>=1.17,<2",
  "pandas>=2.3,<4",
  "websockets>=15,<17",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.5500; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "hypothesis>=6.140,<7", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[project.scripts]
sniper = "sniper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["python/sniper"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/data/ticks/**",
  "/data/bars/**",
  "/data/reports/**",
  "/data/manifests/**",
  "/data/evaluations/**",
  "/data/holdout*/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["python/sniper"]
strict = true
plugins = ["pydantic.mypy"]
